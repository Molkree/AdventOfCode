[project]
name = "AdventOfCode"
version = "0.1.0"
requires-python = ">=3.15"
authors = [{ name = "Dmitry Volodin", email = "mr.molkree@gmail.com" }]
readme = "README.md"


[dependency-groups]
build = ["uv==0.13.6"]
dev = [
    "mypy==2.4.1",
    "prek==0.5.9",
    "ruff==0.17.3",
]

[tool.uv]
exclude-newer = "1 week"

[tool.ruff]
target-version = "py315"

[tool.ruff.lint]
ignore = ["E203", "E701", "S101"]
select = [
    # pycodestyle
    "E", "W",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # flake8-bandit
    "S",
    # pep8-naming
    "N",
    # Ruff
    "RUF",
]
